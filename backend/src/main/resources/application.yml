server:
  port: 8088

spring:
  application:
    name: dorm-match
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dorm_match?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: dorm-match-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    expiration: 86400000
    refresh-expiration: 604800000
  matching:
    weight-sleep: 0.20
    weight-hygiene: 0.20
    weight-lifestyle: 0.20
    weight-social: 0.07
    weight-personality: 0.08
    weight-study: 0.07
    weight-hobby: 0.07
    weight-spending: 0.05
    weight-psychology: 0.06
    top-n: 20
  invite:
    max-pending-sent: 5
    max-pending-received: 10
    expire-hours: 48
